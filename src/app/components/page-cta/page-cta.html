<section class="bg-paper-card border-t border-[#E8E8F0] px-6 lg:px-16 py-20 text-center">
  <h2 class="font-display font-extrabold text-3xl md:text-4xl text-ink max-w-2xl mx-auto mb-4 leading-tight">{{ titleKey | mnTranslate }}</h2>
  <p class="text-text-grey text-base max-w-lg mx-auto mb-8">{{ subKey | mnTranslate }}</p>
  <a mnButton [data]="buttonData" [routerLink]="route" class="font-display font-bold">
    {{ buttonKey | mnTranslate }}
  </a>
</section>
