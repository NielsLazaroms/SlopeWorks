<footer class="bg-paper border-t border-ink/10 w-full">
  <div class="px-6 lg:px-16 py-10">
    <!-- Row 1: brand (left) + social links (right) -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-6 md:gap-0">
      <!-- Logo  -->
      <div class="font-bold">
      <img [src]="componentConfig.logoSrc" [alt]="componentConfig.logoAlt" class="h-24" />
    </div>

      <!-- Social links: growing yellow underline + soft glow on hover/focus -->
      <ul class="flex flex-row gap-9">
        @for (link of componentConfig.links; track link.label) {
          <li class="relative group">
            <a [href]="link.href" target="_blank" rel="noopener noreferrer"
               class="relative font-sans text-sm text-ink transition-colors duration-300 ease-in-out cursor-pointer outline-none group-hover:text-brand-600 group-focus-within:text-brand-600
                      after:content-[''] after:absolute after:left-1/2 after:-bottom-2.5 after:w-0 after:h-0.75 after:bg-brand-500 after:rounded-xs after:transition-all after:duration-300 after:ease-in-out group-hover:after:w-full group-hover:after:left-0 group-focus-within:after:w-full group-focus-within:after:left-0
                      before:content-[''] before:absolute before:left-1/2 before:-bottom-2.75 before:w-0 before:h-2.5 before:bg-brand-500/70 before:blur-[6px] before:opacity-0 before:transition-all before:duration-300 before:ease-in-out group-hover:before:w-full group-hover:before:left-0 group-hover:before:opacity-100 group-focus-within:before:w-full group-focus-within:before:left-0 group-focus-within:before:opacity-100">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>

    <!-- Copyright, quiet centered baseline -->
    <div class="font-sans text-sm text-text-grey text-center mt-8">© {{ currentYear }} {{ componentConfig.copyrightText }}</div>
  </div>
</footer>
