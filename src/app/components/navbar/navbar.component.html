<nav
  class="navbar fixed inset-x-0 top-0 z-100 h-20 border-b border-ink/10"
  [ngClass]="menuOpen ? 'bg-paper' : 'bg-paper/80 backdrop-blur-md'"
>
  <!-- Full-width bar: the left padding is computed to keep the logo aligned to the
       page's max-w-7xl content column, while the right padding is a small edge
       gutter so the Contact CTA sits close to the screen edge. -->
  <div class="w-full h-full flex items-center justify-between gap-6 px-6 lg:pr-8 lg:pl-[max(4rem,calc((100%-80rem)/2+4rem))]">

    <!-- Brand mark -->
    <button type="button" (click)="goHome()" class="shrink-0 cursor-pointer" [attr.aria-label]="componentConfig.logoAlt">
      <img [src]="componentConfig.logoSrc" [alt]="componentConfig.logoAlt" class="max-h-32 w-auto" />
    </button>

    <!-- Desktop navigation -->
    <ul class="hidden lg:flex items-center gap-8 xl:gap-11">
      @for (item of componentConfig.navItems; track item.label) {
        <app-nav-list-item [label]="item.label" [active]="isActive(item)" (itemClick)="onNavItem(item)"></app-nav-list-item>
      }
    </ul>

    <!-- Desktop right cluster: locale toggle + contact CTA -->
    <div class="hidden lg:flex items-center gap-6 shrink-0">
      <div class="flex items-center gap-2 font-display text-[13px] tracking-[0.06em]">
        <button
          type="button"
          (click)="setLocale('nl')"
          [attr.aria-pressed]="currentLocale === 'nl'"
          [class.text-brand-500]="currentLocale === 'nl'"
          [class.font-bold]="currentLocale === 'nl'"
          [class.text-text-grey]="currentLocale !== 'nl'"
          class="cursor-pointer transition-colors duration-300 hover:text-brand-600 focus-visible:outline-none focus-visible:text-brand-600"
        >NL</button>
        <span class="text-ink/25" aria-hidden="true">/</span>
        <button
          type="button"
          (click)="setLocale('en')"
          [attr.aria-pressed]="currentLocale === 'en'"
          [class.text-brand-500]="currentLocale === 'en'"
          [class.font-bold]="currentLocale === 'en'"
          [class.text-text-grey]="currentLocale !== 'en'"
          class="cursor-pointer transition-colors duration-300 hover:text-brand-600 focus-visible:outline-none focus-visible:text-brand-600"
        >EN</button>
      </div>

      @if (componentConfig.contactItem) {
        <button type="button" mnButton [data]="contactData" (click)="onNavItem(componentConfig.contactItem)" class="font-display font-bold cursor-pointer">
          {{ componentConfig.contactItem.label }}
        </button>
      }
    </div>

    <!-- Mobile hamburger -->
    <button
      type="button"
      class="flex lg:hidden flex-col w-10 h-10 items-center justify-center gap-1.5"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
      [attr.aria-expanded]="menuOpen"
    >
      <span class="block w-7 h-0.5 bg-ink rounded-sm transition-all duration-300" [class.translate-y-2]="menuOpen" [class.rotate-45]="menuOpen"></span>
      <span class="block w-7 h-0.5 bg-ink rounded-sm transition-all duration-300" [class.opacity-0]="menuOpen"></span>
      <span class="block w-7 h-0.5 bg-ink rounded-sm transition-all duration-300" [class.-translate-y-2]="menuOpen" [class.-rotate-45]="menuOpen"></span>
    </button>
  </div>
</nav>

<!-- Mobile full-screen menu. Kept a sibling of <nav> (not a child) so the navbar's
     backdrop-blur, which establishes a containing block, doesn't trap this
     fixed-position panel inside the 80px bar. -->
@if (menuOpen) {
  <div class="navbar-menu lg:hidden fixed inset-x-0 top-20 bottom-0 z-90 bg-paper px-6 py-10 flex flex-col items-center justify-center gap-9 overflow-y-auto text-center">
      <ul class="flex flex-col items-center gap-6">
        @for (item of componentConfig.navItems; track item.label) {
          <app-nav-list-item variant="stacked" [label]="item.label" [active]="isActive(item)" (itemClick)="onNavItem(item)"></app-nav-list-item>
        }
      </ul>

      <div class="flex flex-col items-center gap-6">
        @if (componentConfig.contactItem) {
          <button type="button" mnButton [data]="contactMobileData" (click)="onNavItem(componentConfig.contactItem)" class="font-display font-bold cursor-pointer">
            {{ componentConfig.contactItem.label }}
          </button>
        }
        <div class="flex items-center justify-center gap-2.5 font-display text-sm tracking-[0.06em]">
          <button
            type="button"
            (click)="setLocale('nl')"
            [attr.aria-pressed]="currentLocale === 'nl'"
            [class.text-brand-500]="currentLocale === 'nl'"
            [class.font-bold]="currentLocale === 'nl'"
            [class.text-text-grey]="currentLocale !== 'nl'"
            class="cursor-pointer transition-colors duration-300 hover:text-brand-600"
          >NL</button>
          <span class="text-ink/25" aria-hidden="true">/</span>
          <button
            type="button"
            (click)="setLocale('en')"
            [attr.aria-pressed]="currentLocale === 'en'"
            [class.text-brand-500]="currentLocale === 'en'"
            [class.font-bold]="currentLocale === 'en'"
            [class.text-text-grey]="currentLocale !== 'en'"
            class="cursor-pointer transition-colors duration-300 hover:text-brand-600"
          >EN</button>
        </div>
      </div>
    </div>
  }
