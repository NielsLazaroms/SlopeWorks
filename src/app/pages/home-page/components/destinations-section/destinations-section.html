<section class="px-6 lg:px-16 py-24 max-w-7xl mx-auto">
  <app-eyebrow class="mb-4">{{ componentConfig.label }}</app-eyebrow>
  <h2 class="font-display font-extrabold text-3xl md:text-4xl tracking-tight leading-[1.12] max-w-3xl mb-12">{{ componentConfig.title }}</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (card of componentConfig.cards; track card.name) {
      <a
        [routerLink]="card.route"
        class="group block text-left bg-paper-card border border-[#E8E8F0] rounded-lg overflow-hidden transition-all duration-150 hover:-translate-y-1 hover:shadow-[0_10px_24px_rgba(0,0,0,0.08)]"
      >
        <div class="relative h-40 bg-ink-raised overflow-hidden">
          @if (card.imageUrl) {
            <img [src]="card.imageUrl" [alt]="card.imageAlt" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.04]" loading="lazy" />
          }q
        </div>
        <div class="p-6">
          <div class="font-display text-xs tracking-wide uppercase text-text-grey mb-1.5">{{ card.country }}</div>
          <h3 class="font-display font-bold text-xl mb-2">{{ card.name }}</h3>
          <p class="text-sm text-text-grey leading-relaxed">{{ card.tagline }}</p>
          <div class="mt-3.5 flex items-center gap-1.5 font-display text-sm font-semibold text-dark-yellow">{{ card.linkText }}<svg lucideArrowRight [size]="16" aria-hidden="true"></svg></div>
        </div>
      </a>
    }
  </div>

  @if (componentConfig.seeAllText) {
    <div class="text-center mt-9">
      <a mnButton [data]="seeAllData" [routerLink]="componentConfig.seeAllRoute" class="font-display font-bold text-dark-yellow!">
        <span class="inline-flex items-center gap-1.5">{{ componentConfig.seeAllText }}<svg lucideArrowRight [size]="17" aria-hidden="true"></svg></span>
      </a>
    </div>
  }
</section>
