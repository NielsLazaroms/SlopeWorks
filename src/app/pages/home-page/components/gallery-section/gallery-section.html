<section class="py-24">
  <div class="max-w-7xl mx-auto px-6 lg:px-16 mb-10">
    <p class="font-display font-bold text-sm tracking-[0.1em] uppercase text-dark-yellow mb-4">{{ 'home.gallery.label' | mnTranslate }}</p>
    <h2 class="font-display font-extrabold text-3xl md:text-4xl tracking-tight leading-[1.12] max-w-3xl mb-3">{{ 'home.gallery.title' | mnTranslate }}</h2>
    <p class="max-w-2xl text-base leading-relaxed text-text-grey">{{ 'home.pictures.description' | mnTranslate }}</p>
  </div>

  <!-- Film strip with arrows on the sides of the images -->
  <div class="relative">
    <button type="button" (click)="scroll(-1)" aria-label="Previous photos"
            class="absolute left-3 lg:left-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 flex items-center justify-center rounded-full bg-ink/85 text-white backdrop-blur-sm shadow-lg cursor-pointer transition-colors duration-200 hover:bg-brand-500 hover:text-ink">
      <span class="text-xl leading-none -mt-0.5" aria-hidden="true">‹</span>
    </button>

    <div #track class="sw-strip flex gap-4 overflow-x-auto snap-x snap-mandatory scroll-smooth px-6 lg:px-16 pb-2">
      @for (slide of slides; track slide.src) {
        <figure class="relative shrink-0 snap-center h-[280px] md:h-[440px] aspect-[4/3] rounded-xl overflow-hidden bg-ink-raised">
          <img class="absolute inset-0 w-full h-full object-cover" [src]="slide.src" [alt]="slide.altKey | mnTranslate" loading="lazy" />
          <figcaption class="absolute left-4 bottom-4 z-10 inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-ink/60 backdrop-blur-sm text-white text-[12.5px] font-display tracking-wide">
            <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>{{ slide.caption }}
          </figcaption>
        </figure>
      }
    </div>

    <button type="button" (click)="scroll(1)" aria-label="Next photos"
            class="absolute right-3 lg:right-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 flex items-center justify-center rounded-full bg-ink/85 text-white backdrop-blur-sm shadow-lg cursor-pointer transition-colors duration-200 hover:bg-brand-500 hover:text-ink">
      <span class="text-xl leading-none -mt-0.5" aria-hidden="true">›</span>
    </button>
  </div>
</section>
