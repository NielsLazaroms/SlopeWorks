<app-page-hero
  imageUrl="/images/hero_image.webp"
  [eyebrow]="'faq.eyebrow' | mnTranslate"
  [title]="'faq.title' | mnTranslate"
  [subtitle]="'faq.subtitle' | mnTranslate"
></app-page-hero>

<section class="bg-paper">
  <!-- Mobile category chips: horizontal jump-nav where the sticky rail is hidden -->
  <div class="lg:hidden sticky top-20 z-20 bg-paper/95 backdrop-blur border-b border-[#E8E8F0]">
    <div class="flex gap-2 overflow-x-auto px-6 py-3 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
      @for (group of groups; track group.id) {
        <button
          type="button"
          (click)="scrollToGroup(group.id)"
          class="shrink-0 whitespace-nowrap rounded-full border px-3.5 py-1.5 font-display font-semibold text-[12.5px] transition-colors duration-200"
          [class]="activeGroup() === group.id
            ? 'bg-brand-500 text-ink border-brand-500'
            : 'bg-white text-text-grey border-[#E4E4EE]'"
        >{{ group.titleKey | mnTranslate }}</button>
      }
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 lg:px-16 py-16 lg:py-24 grid grid-cols-1 lg:grid-cols-[240px_1fr] gap-10 lg:gap-16">
    <!-- Living index: tracks the reader's position with a growing yellow tick -->
    <nav aria-label="FAQ categories" class="hidden lg:block self-start sticky top-28">
      <p class="font-display font-bold text-[11px] tracking-[0.16em] uppercase text-text-grey mb-5">
        {{ 'faq.indexLabel' | mnTranslate }}
      </p>
      <ul>
        @for (group of groups; track group.id) {
          <li>
            <button
              type="button"
              (click)="scrollToGroup(group.id)"
              [attr.aria-current]="activeGroup() === group.id ? 'true' : null"
              class="group/idx flex items-center gap-3 w-full text-left py-2 cursor-pointer"
            >
              <span
                class="block h-px shrink-0 transition-all duration-300 ease-out"
                [class]="activeGroup() === group.id
                  ? 'w-8 bg-brand-500'
                  : 'w-4 bg-[#D6D6E0] group-hover/idx:w-6 group-hover/idx:bg-dark-yellow'"
                aria-hidden="true"
              ></span>
              <span
                class="font-display text-sm transition-colors duration-200"
                [class]="activeGroup() === group.id
                  ? 'font-bold text-ink'
                  : 'font-medium text-text-grey group-hover/idx:text-ink'"
              >{{ group.titleKey | mnTranslate }}</span>
            </button>
          </li>
        }
      </ul>
    </nav>

    <!-- Grouped Q&A -->
    <div>
      @for (group of groups; track group.id) {
        <section appReveal [id]="group.id" class="scroll-mt-28 mb-16 last:mb-0">
          <app-faq-accordion [items]="group.items" [titleKey]="group.titleKey" [subKey]="group.subKey" />
        </section>
      }
    </div>
  </div>
</section>

<app-page-cta
  appReveal
  titleKey="faq.cta.title"
  subKey="faq.cta.sub"
  buttonKey="faq.cta.button"
></app-page-cta>
